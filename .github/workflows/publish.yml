name: Publish to npm

# Tag a release to publish: `git tag v0.1.0 && git push --tags`.
# The tag version must match package.json.
#
# Auth is OIDC trusted publishing — no NPM_TOKEN secret. One-time setup on
# npmjs.com: package settings -> Trusted Publisher -> GitHub Actions, repo
# j-shelfwood/talos-ui, workflow file `publish.yml`. The package must already
# exist on npm before that config can be added (npm limitation), so 0.1.0 was
# published once manually; every release after is hands-off via this workflow.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC: mint the token npm trusted-publishing exchanges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 20 ships an older
      # npm, so upgrade it explicitly. This is what makes `npm publish` exchange
      # the GitHub OIDC token for a short-lived npm credential — no NPM_TOKEN.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1
          fi
          echo "publishing @j_shelfwood/talos-ui@$PKG"

      - name: Verify package contents
        run: npm pack --dry-run

      # Publish via OIDC trusted publishing — no NPM_TOKEN, no OTP. npm exchanges
      # the GitHub-issued id-token for a short-lived credential, and emits a
      # provenance attestation by default (the --provenance flag is implied).
      # Requires a one-time Trusted Publisher config on the package's npm
      # settings page (publisher: GitHub Actions, repo j-shelfwood/talos-ui,
      # workflow publish.yml). Until that exists, this step fails — set it up
      # after the first manual publish makes the package exist.
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ github.token }}
